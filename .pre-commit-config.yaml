repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --project backend ruff check
        language: system
        types: [python]
        files: ^backend/
      - id: ruff-format
        name: ruff format
        entry: uv run --project backend ruff format --check
        language: system
        types: [python]
        files: ^backend/
      - id: mypy
        name: mypy
        entry: uv run --directory backend mypy app
        language: system
        pass_filenames: false
        files: ^backend/
      - id: frontend-lint
        name: frontend lint
        entry: pnpm --dir frontend lint
        language: system
        pass_filenames: false
        files: ^frontend/
