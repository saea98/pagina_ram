name: cherry

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - media:/srv/media:ro
    networks: [internal]
    logging: *default-logging
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/Mexico_City
      NUXT_API_INTERNAL_URL: http://api:8000
      NUXT_PUBLIC_API_BASE: /api/v1
      HOST: 0.0.0.0
      PORT: "3000"
    networks: [internal]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/Mexico_City
    volumes:
      - media:/srv/media
    networks: [internal]
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: runtime
    command: ["python", "-m", "app.workers"]
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/Mexico_City
    volumes:
      - media:/srv/media
    networks: [internal]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      TZ: America/Mexico_City
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [internal]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  internal:

volumes:
  pg_data:
  media:
  caddy_data:
  caddy_config:
