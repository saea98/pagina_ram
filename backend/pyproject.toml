[project]
name = "cherry-api"
version = "0.1.0"
description = "Cherry Studios API"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.116",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "nh3>=0.3.7",
    "pillow>=12.3.0",
    "pillow-avif-plugin>=1.6.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "python-magic>=0.4.27",
    "python-multipart>=0.0.32",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.1.1",
    "structlog>=26.1.0",
    "uuid-utils>=1.0.0",
    "uvicorn[standard]>=0.35",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
# FastAPI declares dependencies with Depends() in argument defaults.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
"alembic/versions/*.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
  "pillow_avif",
  "nh3",
  "pwdlib",
  "pwdlib.hashers",
  "pwdlib.hashers.argon2",
  "slowapi",
  "aiosmtplib",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.17",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.13",
]
