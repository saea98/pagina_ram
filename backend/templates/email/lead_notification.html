<!DOCTYPE html>
<html lang="es">
  <body style="margin:0;background:#FFF4EB;color:#1C1B1B;font-family:sans-serif;">
    <div style="max-width:560px;margin:0 auto;padding:32px 20px;">
      <p style="margin:0 0 8px;color:#7E0F0D;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;font-size:12px;">Cherry Studios</p>
      <h1 style="font-size:28px;color:#3D0D11;margin:0 0 20px;">Nuevo contacto</h1>
      <p><strong>Nombre:</strong> {{ name }}</p>
      <p><strong>Correo:</strong> {{ email }}</p>
      <p><strong>Teléfono:</strong> {{ phone }}</p>
      <p><strong>Servicio:</strong> {{ service }}</p>
      <p><strong>Página:</strong> {{ source_page }}</p>
      <p style="white-space:pre-wrap;background:#fff;border:1px solid rgba(61,13,17,0.14);padding:16px;">{{ message }}</p>
    </div>
  </body>
</html>
